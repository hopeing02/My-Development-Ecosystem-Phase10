name: MDE CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out MDE Core
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MDE Core and quality tools
        run: python -m pip install -e . pytest ruff black

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Run Ruff
        run: python -m ruff check packages/mde-core/src packages/mde-core/tests tools/tests tests

      - name: Run Black
        run: python -m black --check --target-version py312 --fast packages/mde-core/src packages/mde-core/tests tools/tests tests
