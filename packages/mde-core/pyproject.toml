[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mde-core"
version = "0.6.0"
description = "Core automation engine for My Development Ecosystem"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff==0.15.20"]

[project.scripts]
mde = "mde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mde = ["workflows/*.yaml", "knowledge/viewer/index.html", "knowledge/viewer/assets/*"]
