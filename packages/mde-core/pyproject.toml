[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mde-core"
version = "0.6.0"
description = "Core automation engine for My Development Ecosystem"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
mde = "mde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mde = ["workflows/*.yaml"]
