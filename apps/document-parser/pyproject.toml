[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "document-parser"
version = "0.1.0"
description = "Metadata-only document source validation"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "black==26.10.1",
    "pytest>=8,<10",
    "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
