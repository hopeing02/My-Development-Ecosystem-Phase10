version: 1
project:
  id: autoknowledge-lite
  name: AutoKnowledge Lite
repository:
  default_branch: main
  branch_pattern: "{type}/{assignee}/{task_id}"
  protected_branches:
    - main
commands:
  test:
    - "uv run pytest"
    - "android\\gradlew.bat testDebugUnitTest"
  build:
    - "uv build"
    - "android\\gradlew.bat assembleDebug"
pull_request:
  required: true
  approvals_required: 1
  require_tests: true
